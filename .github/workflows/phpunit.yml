name: PHPUnit

on:
  push:
  pull_request:

jobs:
  test:
    name: PHPUnit PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php: [8.2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: gd, mbstring, mysqli, pdo_sqlite
        coverage: xdebug
        # must be in the system php.ini to reach PHPUnit's isolated child processes
        ini-values: auto_prepend_file=${{ github.workspace }}/tests/uts/phpunit-prepend.php

    - name: Validate composer.json
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPUnit
      run: vendor/bin/phpunit --configuration tests/uts/phpunit.xml --coverage-text