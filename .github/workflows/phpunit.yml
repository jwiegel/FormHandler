name: PHPUnit

on:
  push:
  pull_request:

jobs:
  build:
    name: UTS PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php: [8.2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: gd, mbstring, mysqli
        coverage: xdebug

    - name: Validate composer.json
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run UTS PHPUnit
      env:
        PHPRC: ${{ github.workspace }}/tests/uts
      run: vendor/bin/phpunit --configuration tests/uts/phpunit.xml --coverage-text